name: Publish

# Publishes the SDK to nuget.org when a version tag (e.g. v1.2.3) is pushed.
# Authentication uses NuGet Trusted Publishing (OIDC) — no long-lived API key is stored.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for GitHub to issue the OIDC token
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Derive the package version from the tag: refs/tags/v1.2.3 -> 1.2.3
      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/HypeLabs.Partner.Sdk.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts

      # Exchange the OIDC token for a short-lived nuget.org API key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
